apiVersion: v1
kind: Service
metadata:
  name: cloud-secure-app-service
  namespace: practica-s12
  labels:
    app.kubernetes.io/name: cloud-secure-app
    app.kubernetes.io/part-of: s12-project
  annotations:
    # Integración nativa con Amazon Web Services (AWS Elastic Load Balancer)
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "60"
spec:
  type: LoadBalancer
  selector:
    # Selector alineado exactamente con los labels del Pod (Solución Escenario B)
    app: cloud-secure-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 31080
