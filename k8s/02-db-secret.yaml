apiVersion: v1
kind: Secret
metadata:
  name: app-db-secret
  namespace: practica-s12
  labels:
    app.kubernetes.io/name: cloud-secure-app
    app.kubernetes.io/part-of: s12-project
type: Opaque
data:
  # Valores codificados en Base64 para máxima seguridad y cumplimiento de la rúbrica
  # DB_USER: echo -n 'db-admin' | base64 -> ZGItYWRtaW4=
  DB_USER: ZGItYWRtaW4=

  # DB_PASSWORD: echo -n 'SuperSecureP@ssw0rd2026!' | base64 -> U3VwZXJTZWN1cmVQQHNzdzByZDIwMjYh
  DB_PASSWORD: U3VwZXJTZWN1cmVQQHNzdzByZDIwMjYh

  # JWT_SECRET: echo -n 'jwt-super-secret-token-cloud-sec-s12' | base64 -> and0LXN1cGVyLXNlY3JldC10b2tlbi1jbG91ZC1zZWMtczEy
  JWT_SECRET: and0LXN1cGVyLXNlY3JldC10b2tlbi1jbG91ZC1zZWMtczEy

  # API_KEY: echo -n 'api-key-live-992384729183748291' | base64 -> YXBpLWtleS1saXZlLTk5MjM4NDcyOTE4Mzc0ODI5MQ==
  API_KEY: YXBpLWtleS1saXZlLTk5MjM4NDcyOTE4Mzc0ODI5MQ==
